name: Remote Display Mac input layout DLL

on:
  push:
    branches:
      - mac-input-layout-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win64-dll:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_ROOT: 'C:\vcpkg-fpsdiag'
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      BINDGEN_EXTRA_CLANG_ARGS: --target=x86_64-pc-windows-msvc
      VSCMD_SKIP_SENDTELEMETRY: '1'

    steps:
      - name: Checkout diagnostic fork
        uses: actions/checkout@v4

      - name: Set up Rust for MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Initialize MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install LLVM 18 (bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '18.1.8'
          directory: ${{ runner.temp }}/llvm-18-fpsdiag
          env: 'false'

      # ilammy/msvc-dev-cmd exports Visual Studio's bundled VCPKG_ROOT.
      # Restore our own isolated path after the MSVC action.
      - name: Restore isolated vcpkg path after MSVC setup
        shell: pwsh
        run: |
          $isolatedRoot = 'C:\vcpkg-fpsdiag'
          "VCPKG_ROOT=$isolatedRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "VCPKG_ROOT for subsequent steps: $isolatedRoot"

      # vcpkg manifest version overrides need Git objects from historical ports.
      # A partial/shallow clone produces "promisor remote" errors during checkout-index,
      # especially when runner DNS is briefly unavailable.
      - name: Bootstrap pinned vcpkg (complete Git history)
        shell: pwsh
        run: |
          $pinnedCommit = '120deac3062162151622ca4860575a33844ba10b'
          $cloneOk = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path "$env:VCPKG_ROOT") {
              Remove-Item -LiteralPath "$env:VCPKG_ROOT" -Force -Recurse
            }
            Write-Host "Full vcpkg clone (attempt $attempt of 3)"
            git clone --no-checkout https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            if ($LASTEXITCODE -eq 0) {
              $cloneOk = $true
              break
            }
            Start-Sleep -Seconds (10 * $attempt)
          }
          if (-not $cloneOk) { throw 'Full vcpkg clone failed after 3 attempts' }
          git -C "$env:VCPKG_ROOT" checkout $pinnedCommit
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg pinned checkout failed' }
          $isShallow = (git -C "$env:VCPKG_ROOT" rev-parse --is-shallow-repository).Trim()
          if ($isShallow -ne 'false') { throw 'Unexpected shallow vcpkg clone' }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }

      # Hardware decoding requires FFmpeg and Intel Media SDK headers/libraries.
      # Install the upstream fork's pinned vcpkg manifest including FFmpeg,
      # mfx-dispatch and codec SDKs rather than the incomplete classic list.
      - name: Install all codec dependencies from pinned vcpkg manifest
        working-directory: engine/rustdesk
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet x64-windows-static `
            "--x-install-root=$env:VCPKG_ROOT\installed"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg manifest dependency install failed' }
          $base = "$env:VCPKG_ROOT\installed\x64-windows-static"
          foreach ($header in @('libavcodec/avcodec.h', 'libavutil/attributes.h')) {
            $file = Join-Path "$base\include" $header
            if (-not (Test-Path $file)) { throw "Missing required FFmpeg header: $file" }
          }
          Write-Host "Verified FFmpeg headers in $base"

      - name: Install Flutter SDK only for FFI code generation
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Generate missing Rust FFI bridge (required for the DLL)
        working-directory: engine/rustdesk
        shell: pwsh
        env:
          CLANG_PATH: ${{ env.LLVM_PATH }}\bin\clang.exe
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}\bin
        run: |
          Push-Location flutter
          flutter pub get
          $flutterExit = $LASTEXITCODE
          Pop-Location
          if ($flutterExit -ne 0) { throw 'Flutter package resolution failed' }
          cargo install cargo-expand --version 1.0.95 --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-expand installation failed' }
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          if ($LASTEXITCODE -ne 0) { throw 'flutter_rust_bridge_codegen installation failed' }
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --llvm-path "$env:LLVM_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'FFI Rust bridge generation failed' }
          if (-not (Test-Path 'src/bridge_generated.rs')) { throw 'Bridge source missing' }

      - name: Build only modified Rust engine DLL
        working-directory: engine/rustdesk
        shell: pwsh
        env:
          CLANG_PATH: ${{ env.LLVM_PATH }}\bin\clang.exe
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}\bin
        run: |
          Write-Host "LLVM path: $env:LLVM_PATH"
          Write-Host "MSVC: $env:VCToolsInstallDir"
          rustup show
          cargo build --locked --release --lib --features flutter,hwcodec --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust DLL build failed' }
          if (-not (Test-Path 'target/x86_64-pc-windows-msvc/release/librustdesk.dll')) {
            throw 'DLL not found at expected build output path'
          }

      - name: Upload DLL for local A/B testing
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDisplay-Mac-Input-Layout-DLL
          path: engine/rustdesk/target/x86_64-pc-windows-msvc/release/librustdesk.dll
          retention-days: 14
          if-no-files-found: error
