name: Remote Display FPS30 diagnostic DLL

on:
  push:
    branches:
      - fps30-diagnostic
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win64-dll:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VCPKG_ROOT: 'C:\vcpkg-fpsdiag'
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
      BINDGEN_EXTRA_CLANG_ARGS: --target=x86_64-pc-windows-msvc
      VSCMD_SKIP_SENDTELEMETRY: '1'
      VCPKG_BINARY_SOURCES: 'clear;files,C:\vcpkg-fpsdiag-cache,readwrite'

    steps:
      - name: Checkout diagnostic fork
        uses: actions/checkout@v4

      - name: Preflight source and fetch official v1.0.16 DLL baseline
        shell: pwsh
        run: |
          $code = 'engine/rustdesk/src/client/io_loop.rs'
          if (-not (Select-String -Path $code -Pattern 'RD_FPS_DIAG_CAP' -Quiet)) {
            throw 'Expected FPS30 source patch was not found'
          }
          $url = 'https://github.com/SamuelRioTz/remotedisplay/releases/download/v1.0.16/RemoteDisplay-1.0.16-windows-x64-portable.zip'
          $archive = Join-Path $env:RUNNER_TEMP 'RD-original-v1.0.16.zip'
          $out = Join-Path $env:RUNNER_TEMP 'RD-original-v1.0.16'
          & curl.exe -fL --retry 3 --retry-all-errors --retry-delay 5 -o "$archive" "$url"
          if ($LASTEXITCODE -ne 0) { throw 'Original v1.0.16 portable ZIP could not be downloaded' }
          Expand-Archive -LiteralPath "$archive" -DestinationPath "$out" -Force
          $originalDll = Get-ChildItem -LiteralPath "$out" -Filter 'librustdesk.dll' -Recurse -File | Select-Object -First 1
          if (-not $originalDll) { throw 'Original DLL missing from the official release ZIP' }
          "RD_ORIGINAL_DLL=$($originalDll.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Found baseline DLL: $($originalDll.FullName)"
          foreach ($script in @('run-fps30-normal.cmd', 'run-fps30-force30.cmd', 'run-fps30-force60.cmd', 'run-fps30-force120.cmd')) {
            if (-not (Test-Path "tools/windows/$script")) { throw "Missing diagnostic launcher: $script" }
          }

      - name: Set up Rust for MSVC
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Restore Rust compiled dependencies on retry
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine/rustdesk -> target"
          prefix-key: fps30-win64
          cache-on-failure: 'true'

      - name: Initialize MSVC developer shell
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Install LLVM 18 (bindgen)
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '18.1.8'
          directory: ${{ runner.temp }}/llvm-18-fpsdiag
          env: 'false'

      # ilammy/msvc-dev-cmd exports Visual Studio's bundled VCPKG_ROOT.
      # Restore our own isolated path after the MSVC action.
      - name: Restore isolated vcpkg path after MSVC setup
        shell: pwsh
        run: |
          $isolatedRoot = 'C:\vcpkg-fpsdiag'
          "VCPKG_ROOT=$isolatedRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "VCPKG_ROOT for subsequent steps: $isolatedRoot"

      # vcpkg manifest version overrides need Git objects from historical ports.
      # A partial/shallow clone produces "promisor remote" errors during checkout-index,
      # especially when runner DNS is briefly unavailable.
      - name: Bootstrap pinned vcpkg (complete Git history)
        shell: pwsh
        run: |
          $pinnedCommit = '120deac3062162151622ca4860575a33844ba10b'
          $cloneOk = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            if (Test-Path "$env:VCPKG_ROOT") {
              Remove-Item -LiteralPath "$env:VCPKG_ROOT" -Force -Recurse
            }
            Write-Host "Full vcpkg clone (attempt $attempt of 3)"
            git clone --no-checkout https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
            if ($LASTEXITCODE -eq 0) {
              $cloneOk = $true
              break
            }
            Start-Sleep -Seconds (10 * $attempt)
          }
          if (-not $cloneOk) { throw 'Full vcpkg clone failed after 3 attempts' }
          git -C "$env:VCPKG_ROOT" checkout $pinnedCommit
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg pinned checkout failed' }
          $isShallow = (git -C "$env:VCPKG_ROOT" rev-parse --is-shallow-repository).Trim()
          if ($isShallow -ne 'false') { throw 'Unexpected shallow vcpkg clone' }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }

      - name: Restore vcpkg binary package cache
        id: rd-vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg-fpsdiag-cache
          key: fps30-win2022-vcpkg-120deac-${{ hashFiles('engine/rustdesk/vcpkg.json') }}-v1

      # Hardware decoding requires FFmpeg and Intel Media SDK headers/libraries.
      # Install the upstream fork's pinned vcpkg manifest including FFmpeg,
      # mfx-dispatch and codec SDKs rather than the incomplete classic list.
      - name: Install all codec dependencies from pinned vcpkg manifest
        working-directory: engine/rustdesk
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'C:\vcpkg-fpsdiag-cache' | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            --triplet x64-windows-static `
            "--x-install-root=$env:VCPKG_ROOT\installed"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg manifest dependency install failed' }
          $base = "$env:VCPKG_ROOT\installed\x64-windows-static"
          foreach ($header in @('libavcodec/avcodec.h', 'libavutil/attributes.h')) {
            $file = Join-Path "$base\include" $header
            if (-not (Test-Path $file)) { throw "Missing required FFmpeg header: $file" }
          }
          Write-Host "Verified FFmpeg headers in $base"

      - name: Save vcpkg compiled packages (even if later Rust build fails)
        if: steps.rd-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg-fpsdiag-cache
          key: fps30-win2022-vcpkg-120deac-${{ hashFiles('engine/rustdesk/vcpkg.json') }}-v1

      - name: Install Flutter SDK only for FFI code generation
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'

      - name: Generate missing Rust FFI bridge (required for the DLL)
        working-directory: engine/rustdesk
        shell: pwsh
        env:
          CLANG_PATH: ${{ env.LLVM_PATH }}\bin\clang.exe
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}\bin
        run: |
          Push-Location flutter
          flutter pub get
          $flutterExit = $LASTEXITCODE
          Pop-Location
          if ($flutterExit -ne 0) { throw 'Flutter package resolution failed' }
          cargo install cargo-expand --version 1.0.95 --locked
          if ($LASTEXITCODE -ne 0) { throw 'cargo-expand installation failed' }
          cargo install flutter_rust_bridge_codegen --version 1.80.1 --features uuid --locked
          if ($LASTEXITCODE -ne 0) { throw 'flutter_rust_bridge_codegen installation failed' }
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --llvm-path "$env:LLVM_PATH"
          if ($LASTEXITCODE -ne 0) { throw 'FFI Rust bridge generation failed' }
          if (-not (Test-Path 'src/bridge_generated.rs')) { throw 'Bridge source missing' }

      - name: Build only modified Rust engine DLL
        working-directory: engine/rustdesk
        shell: pwsh
        env:
          CLANG_PATH: ${{ env.LLVM_PATH }}\bin\clang.exe
          LIBCLANG_PATH: ${{ env.LLVM_PATH }}\bin
        run: |
          Write-Host "LLVM path: $env:LLVM_PATH"
          Write-Host "MSVC: $env:VCToolsInstallDir"
          rustup show
          cargo build --locked --release --lib --features flutter,hwcodec --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw 'Rust DLL build failed' }
          if (-not (Test-Path 'target/x86_64-pc-windows-msvc/release/librustdesk.dll')) {
            throw 'DLL not found at expected build output path'
          }

      - name: Verify exact exported API matches original 1.0.16 DLL
        shell: pwsh
        run: |
          $newDll = 'engine/rustdesk/target/x86_64-pc-windows-msvc/release/librustdesk.dll'
          if (-not (Test-Path $newDll)) { throw 'Diagnostic DLL was not built' }
          if (-not (Test-Path $env:RD_ORIGINAL_DLL)) { throw 'Original DLL baseline missing' }
          $pattern = '^\s*\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+(\S+)'
          $original = @(& dumpbin.exe /exports "$env:RD_ORIGINAL_DLL" | ForEach-Object {
            if ($_ -match $pattern) { $Matches[1] }
          } | Sort-Object -Unique)
          $diagnostic = @(& dumpbin.exe /exports "$newDll" | ForEach-Object {
            if ($_ -match $pattern) { $Matches[1] }
          } | Sort-Object -Unique)
          Write-Host "Exports: original=$($original.Count), diagnostic=$($diagnostic.Count)"
          if ($original.Count -lt 100 -or $diagnostic.Count -lt 100) {
            throw 'Could not read enough exported functions from DLLs'
          }
          $mismatch = @(Compare-Object -ReferenceObject $original -DifferenceObject $diagnostic)
          if ($mismatch.Count -gt 0) {
            $mismatch | Select-Object -First 30 | Format-Table | Out-String | Write-Host
            throw "DLL exports differ from the released v1.0.16 Windows DLL ($($mismatch.Count) mismatches)"
          }
          Write-Host 'PASS: diagnostic DLL exports match the original (runtime still must be tested separately)'

      - name: Package DLL and normal/force30 launchers
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'rd-fps30-diagnostic-package'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item 'engine/rustdesk/target/x86_64-pc-windows-msvc/release/librustdesk.dll' "$out/librustdesk.dll"
          Copy-Item 'tools/windows/run-fps30-normal.cmd' "$out/run-fps30-normal.cmd"
          Copy-Item 'tools/windows/run-fps30-force30.cmd' "$out/run-fps30-force30.cmd"
          Copy-Item 'tools/windows/run-fps30-force60.cmd' "$out/run-fps30-force60.cmd"
          Copy-Item 'tools/windows/run-fps30-force120.cmd' "$out/run-fps30-force120.cmd"
          Copy-Item 'tools/windows/README_FPS30_KO.md' "$out/README_FPS30_KO.md"
          Copy-Item 'LICENSE' "$out/LICENSE.txt"
          Copy-Item 'NOTICE.md' "$out/NOTICE.md"

      - name: Upload verified diagnostic kit for separate portable copy
        uses: actions/upload-artifact@v4
        with:
          name: RemoteDisplay-FPS30-Diagnostic-Kit
          path: ${{ runner.temp }}/rd-fps30-diagnostic-package/
          retention-days: 14
          if-no-files-found: error
